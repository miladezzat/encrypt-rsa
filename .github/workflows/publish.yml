# Publish a new stable version using npm's GitHub Actions trusted publisher.
# npm package settings must authorize miladezzat/encrypt-rsa, publish.yml.

name: NPM publish

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  check-release:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check registry version
        id: release
        run: node scripts/check-release.js

  build-and-publish:
    needs: check-release
    if: needs.check-release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Use an OIDC-capable npm CLI
        run: npm install --global npm@11.13.0

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: 0

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test && npm run test:release

      - name: Run package smoke tests
        run: npm run smoke

      - name: Run packed install smoke test
        run: npm run smoke:install

      - name: Install optional AI example dependencies
        run: npm --prefix examples/ai-integrations ci

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke test
        run: npm run smoke:browser

      - name: Generate and validate docs
        run: npm run docs && npm run smoke:docs && npm run smoke:docs:browser

      - name: Validate optional AI examples
        run: npm run test:ai

      - name: Publish to npm
        run: npm publish --access public

      - name: Verify published version
        run: node scripts/verify-release.js

  verify-existing-release:
    needs: check-release
    if: needs.check-release.outputs.publish == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify existing npm version
        run: node scripts/verify-release.js
