# Runs on push to master: install deps, test, build, then publish to npm (if version bumped).
# Requires: NPM_TOKEN secret in repo Settings > Secrets and variables > Actions.

name: NPM publish

on:
  push:
    branches: [ master ]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: 0

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Run package smoke tests
        run: npm run smoke

      - name: Run packed install smoke test
        run: npm run smoke:install

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke test
        run: npm run smoke:browser

      - name: Generate and validate docs
        run: npm run docs && npm run smoke:docs

      # Fail fast with a clear message if NPM_TOKEN is missing/expired/wrong-scoped.
      # Without this, npm-publish reports auth failures as a misleading "404 on PUT".
      - name: Verify npm auth
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        id: publish
        uses: JS-DevTools/npm-publish@v3
        with:
          token: ${{ secrets.NPM_TOKEN }}

      - if: steps.publish.outputs.type != 'none'
        run: |
          echo "Published version ${{ steps.publish.outputs.version }} (previous: ${{ steps.publish.outputs.old-version }})"
